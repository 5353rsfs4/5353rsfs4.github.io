<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STRIKE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
body {
  font-family: 'Courier New', monospace;
  cursor: default;
  user-select: none;
}
#gameCanvas {
  display:block;
  width:100%;
  height:100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
/* UI Overlays */
.overlay {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.overlay.active { display:flex; pointer-events:auto; }
#startScreen {
  background: radial-gradient(ellipse at center, rgba(20,20,50,0.92) 0%, rgba(0,0,0,0.98) 100%);
}
#startScreen h1 {
  font-size: 4.5rem;
  letter-spacing: 0.3em;
  color: #00ffcc;
  text-shadow: 0 0 30px rgba(0,255,204,0.6), 0 0 60px rgba(0,255,204,0.3);
  margin-bottom: 0.2rem;
  animation: pulse 2s ease-in-out infinite;
}
#startScreen h2 {
  font-size: 1.2rem;
  color: #ff4466;
  letter-spacing: 0.5em;
  margin-bottom: 2.5rem;
  text-shadow: 0 0 15px rgba(255,68,102,0.5);
}
#startScreen .instructions {
  background: rgba(0,20,30,0.6);
  border: 1px solid rgba(0,255,204,0.3);
  border-radius: 8px;
  padding: 1.5rem 2.5rem;
  margin-bottom: 2rem;
  font-size: 0.95rem;
  line-height: 2;
  color: #88ccdd;
  backdrop-filter: blur(4px);
}
#startScreen .instructions .key {
  display:inline-block;
  background: rgba(0,255,204,0.15);
  border: 1px solid rgba(0,255,204,0.4);
  border-radius: 4px;
  padding: 2px 10px;
  color: #00ffcc;
  font-weight:bold;
  margin-right: 8px;
  min-width: 30px;
  text-align:center;
}
#startScreen .instructions .section-title {
  color: #00ffcc;
  font-size: 0.85rem;
  letter-spacing: 0.2em;
  margin-bottom: 0.3rem;
  text-transform: uppercase;
}
#startBtn {
  font-family: 'Courier New', monospace;
  font-size: 1.4rem;
  color: #000;
  background: linear-gradient(135deg, #00ffcc, #00ddaa);
  border: none;
  padding: 14px 60px;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 0.3em;
  font-weight: bold;
  box-shadow: 0 0 30px rgba(0,255,204,0.4);
  transition: all 0.2s;
  pointer-events:auto;
}
#startBtn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 0 50px rgba(0,255,204,0.7);
}
#startBtn:active { transform: scale(0.98); }
#gameOverScreen {
  background: radial-gradient(ellipse at center, rgba(50,0,0,0.85) 0%, rgba(0,0,0,0.97) 100%);
}
#gameOverScreen h1 {
  font-size: 4rem;
  color: #ff4466;
  letter-spacing: 0.3em;
  text-shadow: 0 0 30px rgba(255,68,102,0.6);
  margin-bottom: 1rem;
}
#gameOverScreen .stats {
  background: rgba(20,0,10,0.6);
  border: 1px solid rgba(255,68,102,0.3);
  border-radius: 8px;
  padding: 1.5rem 3rem;
  margin-bottom: 2rem;
  text-align:center;
}
#gameOverScreen .stats .stat-row {
  font-size: 1.1rem;
  color: #ddaaaa;
  margin: 0.5rem 0;
}
#gameOverScreen .stats .stat-row .val {
  color: #ff4466;
  font-weight:bold;
  font-size: 1.4rem;
  margin-left: 1rem;
}
#restartBtn {
  font-family: 'Courier New', monospace;
  font-size: 1.3rem;
  color: #000;
  background: linear-gradient(135deg, #ff4466, #ff6644);
  border: none;
  padding: 12px 50px;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 0.2em;
  font-weight: bold;
  box-shadow: 0 0 30px rgba(255,68,102,0.4);
  transition: all 0.2s;
  pointer-events:auto;
}
#restartBtn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 0 50px rgba(255,68,102,0.7);
}
/* HUD */
#hud {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:50;
  display:none;
}
#hud.active { display:block; }
.hud-bar {
  position:absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display:flex;
  gap: 30px;
  align-items:flex-end;
}
.hud-panel {
  background: rgba(0,10,20,0.65);
  border: 1px solid rgba(0,255,204,0.25);
  border-radius: 6px;
  padding: 8px 18px;
  backdrop-filter: blur(3px);
  text-align:center;
}
.hud-panel .label {
  font-size: 0.65rem;
  color: #448899;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.hud-panel .value {
  font-size: 1.6rem;
  font-weight: bold;
  letter-spacing: 0.1em;
}
#healthPanel .value { color: #ff4466; }
#scorePanel .value { color: #00ffcc; }
#wavePanel .value { color: #ffcc00; }
#ammoPanel .value { color: #ffaa44; }
#ammoPanel.reloading .value { color: #ff6600; animation: blink 0.5s steps(2) infinite; }
/* Top bar */
.top-bar {
  position:absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  display:flex;
  gap:20px;
}
.top-panel {
  background: rgba(0,10,20,0.55);
  border: 1px solid rgba(0,255,204,0.2);
  border-radius: 4px;
  padding: 5px 15px;
  font-size: 0.85rem;
  color: #88ccdd;
}
#comboDisplay {
  color: #ffcc00;
  font-weight: bold;
}
/* Wave announcement */
#waveAnnounce {
  position:absolute;
  top: 35%;
  left:50%;
  transform: translate(-50%,-50%);
  text-align:center;
  opacity:0;
  transition: opacity 0.3s;
  pointer-events:none;
}
#waveAnnounce.show { opacity:1; }
#waveAnnounce .wave-title {
  font-size: 2.5rem;
  color: #00ffcc;
  letter-spacing: 0.3em;
  text-shadow: 0 0 30px rgba(0,255,204,0.6);
}
#waveAnnounce .wave-sub {
  font-size: 1rem;
  color: #ff4466;
  letter-spacing: 0.2em;
  margin-top: 0.5rem;
}
/* Damage vignette */
#damageVignette {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:40;
  box-shadow: inset 0 0 200px rgba(255,0,0,0);
  transition: box-shadow 0.15s;
}
#damageVignette.hit {
  box-shadow: inset 0 0 200px rgba(255,0,0,0.7);
}
/* Crosshair */
#crosshair {
  position:absolute;
  top:50%; left:50%;
  transform: translate(-50%,-50%);
  pointer-events:none;
  z-index:45;
}
/* CRT scanlines */
#scanlines {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:60;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.12) 0px,
    rgba(0,0,0,0.12) 1px,
    transparent 1px,
    transparent 3px
  );
}
/* Pause screen */
#pauseScreen {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.75);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:90;
  pointer-events:auto;
}
#pauseScreen.active { display:flex; }
#pauseScreen h2 {
  font-size: 2.5rem;
  color: #00ffcc;
  letter-spacing: 0.3em;
  margin-bottom: 1rem;
}
#pauseScreen p {
  color: #88ccdd;
  font-size: 1rem;
}
/* Animations */
@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.7; }
}
@keyframes blink {
  50% { opacity:0.4; }
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- CRT Scanlines -->
<div id="scanlines"></div>

<!-- Damage Vignette -->
<div id="damageVignette"></div>

<!-- Crosshair -->
<svg id="crosshair" width="40" height="40" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="12" fill="none" stroke="rgba(0,255,204,0.5)" stroke-width="1"/>
  <line x1="20" y1="6" x2="20" y2="14" stroke="rgba(0,255,204,0.9)" stroke-width="2"/>
  <line x1="20" y1="26" x2="20" y2="34" stroke="rgba(0,255,204,0.9)" stroke-width="2"/>
  <line x1="6" y1="20" x2="14" y2="20" stroke="rgba(0,255,204,0.9)" stroke-width="2"/>
  <line x1="26" y1="20" x2="34" y2="20" stroke="rgba(0,255,204,0.9)" stroke-width="2"/>
  <circle cx="20" cy="20" r="1.5" fill="rgba(0,255,204,1)"/>
</svg>

<!-- HUD -->
<div id="hud">
  <div class="top-bar">
    <div class="top-panel" id="comboDisplay" style="display:none;"></div>
    <div class="top-panel">敌人剩余: <span id="enemiesLeft">0</span></div>
  </div>
  <div class="hud-bar">
    <div class="hud-panel" id="healthPanel">
      <div class="label">血量</div>
      <div class="value" id="healthVal">100</div>
    </div>
    <div class="hud-panel" id="scorePanel">
      <div class="label">分数</div>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div class="hud-panel" id="wavePanel">
      <div class="label">波次</div>
      <div class="value" id="waveVal">1</div>
    </div>
    <div class="hud-panel" id="ammoPanel">
      <div class="label">弹药</div>
      <div class="value" id="ammoVal">30/30</div>
    </div>
    <div class="hud-panel" id="crouchPanel" style="display:none;">
      <div class="label">姿势</div>
      <div class="value" style="color:#44ddff;">蹲下</div>
    </div>
  </div>
</div>

<!-- Wave Announcement -->
<div id="waveAnnounce">
  <div class="wave-title" id="waveAnnounceTitle">WAVE 1</div>
  <div class="wave-sub" id="waveAnnounceSub">3 个敌人来袭</div>
</div>

<!-- Start Screen -->
<div class="overlay active" id="startScreen">
  <h1>NEON STRIKE</h1>
  <h2>光线投射 射击游戏</h2>
  <div class="instructions">
    <div class="section-title">移动</div>
    <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动 &nbsp;&nbsp;
    <span class="key">SHIFT</span> 冲刺 &nbsp;&nbsp;
    <span class="key">←</span><span class="key">→</span> 转视角&nbsp;&nbsp;
    <span class="key">↑</span><span class="key">↓</span> 上下瞄准<br>
    鼠标 转视角 + 上下瞄准（需锁定）<br>
    <div class="section-title" style="margin-top:0.8rem;">战斗</div>
    <span class="key">左键</span> 射击（全自动，按住连发）&nbsp;&nbsp;
    <span class="key">R</span> 换弹 &nbsp;&nbsp;
    <span class="key">C</span> 蹲下减后坐力 &nbsp;&nbsp;
    <span class="key">ESC</span> 暂停<br>
    <div class="section-title" style="margin-top:0.8rem;">目标</div>
    消灭所有敌人，生存到最后一波。敌人会开枪反击！连击不间断可获额外分数。
  </div>
  <button id="startBtn">开始游戏</button>
</div>

<!-- Game Over Screen -->
<div class="overlay" id="gameOverScreen">
  <h1 id="gameOverTitle">GAME OVER</h1>
  <div class="stats">
    <div class="stat-row">最终分数<span class="val" id="finalScore">0</span></div>
    <div class="stat-row">存活波次<span class="val" id="finalWave">0</span></div>
    <div class="stat-row">击杀数<span class="val" id="finalKills">0</span></div>
    <div class="stat-row">最高连击<span class="val" id="finalCombo">0</span></div>
  </div>
  <button id="restartBtn">再来一局</button>
</div>

<!-- Pause Screen -->
<div id="pauseScreen">
  <h2>已暂停</h2>
  <p>点击屏幕继续游戏</p>
  <p style="margin-top:0.5rem;font-size:0.8rem;color:#448899;">提示：← → 键也可转视角</p>
</div>

let zBuffer = new Float32Array(1);
let ceilGrad = null, floorGrad = null;
const RENDER_SCALE = 3; // render at 1/3 resolution, CSS scales up (pixelated)

function resize() {
  const dw = window.innerWidth;
  const dh = window.innerHeight;
  W = canvas.width = Math.max(320, Math.floor(dw / RENDER_SCALE));
  H = canvas.height = Math.max(200, Math.floor(dh / RENDER_SCALE));
  zBuffer = new Float32Array(W);
  // Pre-create gradients (avoid creating every frame)
  ceilGrad = ctx.createLinearGradient(0, 0, 0, H/2);
  ceilGrad.addColorStop(0, '#0a0a1a');
  ceilGrad.addColorStop(1, '#1a1a2e');
  floorGrad = ctx.createLinearGradient(0, H/2, 0, H);
  floorGrad.addColorStop(0, '#1a1a2e');
  floorGrad.addColorStop(1, '#0d0d15');
}
resize();
window.addEventListener('resize', resize);

// ---- Pre-rendered Enemy Sprites ----
// Instead of per-pixel fillRect (which killed performance), we render each
// enemy type once to an offscreen canvas, then slice it column-by-column
// with drawImage during the raycaster pass.  This is GPU-accelerated and
// lets us draw detailed humanoid / drone models cheaply.
const SPRITE_RES = 128;
const enemySprites = {};   // type → { normal: canvas, white: canvas }

function preRenderEnemySprites() {
  for (const type of Object.keys(enemyTypes)) {
    const def = enemyTypes[type];
    // Normal (coloured) version
    const normal = document.createElement('canvas');
    normal.width = normal.height = SPRITE_RES;
    const nctx = normal.getContext('2d');
    drawEnemyModel(nctx, type, def);
    // White version (hurt flash overlay)
    const white = document.createElement('canvas');
    white.width = white.height = SPRITE_RES;
    const wctx = white.getContext('2d');
    wctx.drawImage(normal, 0, 0);
    wctx.globalCompositeOperation = 'source-in';
    wctx.fillStyle = '#ffffff';
    wctx.fillRect(0, 0, SPRITE_RES, SPRITE_RES);
    enemySprites[type] = { normal, white };
  }
}

// Convert #rrggbb → {r,g,b}
function hexRGB(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}

    tg.addColorStop(0, '#2a2a2a'); tg.addColorStop(0.5, '#1a1a1a'); tg.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(cx-14, 34); ctx.lineTo(cx+14, 34);
    ctx.lineTo(cx+12, 64); ctx.lineTo(cx-12, 64);
    ctx.closePath(); ctx.fill();
    // Hoodie zipper
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx, 34); ctx.lineTo(cx, 64); ctx.stroke();
    // Zipper pull
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(cx-1, 56, 2, 3);
    // Kangaroo pocket
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(cx-8, 48); ctx.lineTo(cx+8, 48);
    ctx.lineTo(cx+6, 58); ctx.lineTo(cx-6, 58);
    ctx.closePath(); ctx.fill();
    // Drawstrings
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx-3, 34); ctx.lineTo(cx-4, 42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+3, 34); ctx.lineTo(cx+4, 42); ctx.stroke();

    // ---- Arms ----
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(cx-19, 36, 7, 24);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(cx-19, 36, 2, 24);
    // Left hand (pale)
    ctx.fillStyle = '#c0a878';
    ctx.fillRect(cx-16, 54, 5, 8);
    ctx.fillStyle = '#a08858';
    ctx.fillRect(cx-16, 54, 5, 1);
    // Right arm
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(cx+12, 36, 7, 24);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(cx+18, 36, 1, 24);
    // Right hand (raised, holding knife)
    ctx.fillStyle = '#c0a878';
    ctx.fillRect(cx+13, 48, 5, 8);

    // ---- Combat knife (right hand, blade up) ----
    // Handle
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(cx+14, 46, 3, 6);
    // Guard
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(cx+13, 44, 5, 2);
    // Blade
    const blg = ctx.createLinearGradient(cx+14, 30, cx+17, 44);
    blg.addColorStop(0, '#c0c0c0'); blg.addColorStop(0.5, '#e0e0e0'); blg.addColorStop(1, '#808080');
    ctx.fillStyle = blg;
    ctx.beginPath();
    ctx.moveTo(cx+14, 44); ctx.lineTo(cx+17, 44);
    ctx.lineTo(cx+16, 30); ctx.lineTo(cx+15, 30);
    ctx.closePath(); ctx.fill();
    // Blade edge
    ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(cx+16, 30); ctx.lineTo(cx+16, 44); ctx.stroke();

    // ---- Neck ----
    ctx.fillStyle = '#a09080';
    ctx.fillRect(cx-3, 28, 6, 6);
    ctx.fillStyle = '#806850';
    ctx.fillRect(cx-3, 28, 6, 1);

    // ---- Head: black beanie + red bandana ----
    // Beanie
    const bng = ctx.createRadialGradient(cx-2, 8, 1, cx, 12, 12);
    bng.addColorStop(0, '#2a2a2a'); bng.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = bng;
    ctx.beginPath();
    ctx.ellipse(cx, 12, 11, 9, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(cx-11, 12, 22, 4);
    // Beanie rim
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-11, 15, 22, 2);
    // Knit texture
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 0.4;
    for (let x = cx-9; x <= cx+9; x += 3) {
      ctx.beginPath(); ctx.moveTo(x, 7); ctx.lineTo(x, 14); ctx.stroke();
    }
    // Face (pale skin)
    ctx.fillStyle = '#b8a090';
    ctx.beginPath();
    ctx.ellipse(cx, 20, 8, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(cx+3, 20, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(cx-5, 18, 3, 2);
    ctx.fillRect(cx+2, 18, 3, 2);
    // Brow shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(cx-5, 17, 3, 1);
    ctx.fillRect(cx+2, 17, 3, 1);
    // Red bandana (lower face)
    const bdg = ctx.createLinearGradient(cx, 22, cx, 30);
    bdg.addColorStop(0, '#cc2222'); bdg.addColorStop(1, '#8a1414');
    ctx.fillStyle = bdg;
    ctx.beginPath();
    ctx.moveTo(cx-9, 22); ctx.lineTo(cx+9, 22);
    ctx.lineTo(cx+7, 30); ctx.lineTo(cx-7, 30);
    ctx.closePath(); ctx.fill();
    // Bandana knot
    ctx.fillStyle = '#aa1818';
    ctx.beginPath();
    ctx.moveTo(cx+7, 24); ctx.lineTo(cx+12, 25);
    ctx.lineTo(cx+11, 29); ctx.lineTo(cx+7, 28);
    ctx.closePath(); ctx.fill();
    // Bandana tail
    ctx.fillStyle = '#8a1414';
    ctx.beginPath();
    ctx.moveTo(cx+10, 27); ctx.lineTo(cx+14, 32);
    ctx.lineTo(cx+12, 33); ctx.lineTo(cx+9, 29);
    ctx.closePath(); ctx.fill();
    // Bandana pattern
    ctx.strokeStyle = '#6a0a0a'; ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(cx-7, 24); ctx.lineTo(cx+7, 24);
    ctx.moveTo(cx-6, 27); ctx.lineTo(cx+6, 27);
    ctx.stroke();
  }
}

let enemies = [];
let wave = 0;
let waveActive = false;
let enemiesRemaining = 0;
let waveTransitionTimer = 0;
const MAX_WAVES = 8;
let killFeed = [];   // floating kill-confirmation popups
let enemyTracers = [];  // enemy→player tracer lines

// ---- Particles ----
let particles = [];

function spawnParticle(x, y, vx, vy, life, size, color) {
  particles.push({ x, y, vx, vy, life, maxLife: life, size, color });
